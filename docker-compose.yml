services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: patronmvc-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codejavu
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - patronmvc-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patronmvc-app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: codejavu
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - patronmvc-net

networks:
  patronmvc-net:
    driver: bridge

volumes:
  db_data:
